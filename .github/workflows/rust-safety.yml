name: Rust Safety Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Honest naming (ROADMAP Phase 4, Gap G13): this runs the standard
  # `-D warnings` lint set, not clippy::pedantic — the name said "Pedantic"
  # while the command did not.
  clippy-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create dist placeholder (required by tauri::generate_context!)
        run: mkdir -p apps/recon-app/frontend/dist && touch apps/recon-app/frontend/dist/index.html

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - run: cargo clippy --workspace --all-targets -- -D warnings

  miri-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        crate:
          - recon-core
          - recon-config
          - recon-bridge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: miri

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - run: cargo +nightly miri test -p ${{ matrix.crate }}
