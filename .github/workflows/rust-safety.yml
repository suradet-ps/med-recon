name: Rust Safety Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Honest naming (ROADMAP Phase 4, Gap G13): this runs the standard
  # `-D warnings` lint set, not clippy::pedantic - the name said "Pedantic"
  # while the command did not.
  clippy-workspace:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create dist placeholder (required by tauri::generate_context!)
        run: mkdir -p apps/med-recon-app/frontend/dist && touch apps/med-recon-app/frontend/dist/index.html

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - run: cargo clippy --workspace --all-targets -- -D warnings

  miri-test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        crate:
          - med-recon-core
          - med-recon-config
          - med-recon-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: miri

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      # med-recon-config/med-recon-core tests use tempfile (real mkdir) - allow
      # filesystem ops under Miri while still checking for UB.
      - name: Run Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p ${{ matrix.crate }}
