name: Rust Safety Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Honest naming (ROADMAP Phase 4, Gap G13): this runs the standard
  # `-D warnings` lint set, not clippy::pedantic — the name said "Pedantic"
  # while the command did not.
  clippy-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create dist placeholder (required by tauri::generate_context!)
        run: mkdir -p apps/med-recon-app/frontend/dist && touch apps/med-recon-app/frontend/dist/index.html

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - run: cargo clippy --workspace --all-targets -- -D warnings

  miri-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        crate:
          - med-recon-core
          - med-recon-config
          - med-recon-bridge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: miri

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      # med-recon-config/med-recon-core tests use tempfile (real mkdir) — allow
      # filesystem ops under Miri while still checking for UB.
      - name: Run Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p ${{ matrix.crate }}
