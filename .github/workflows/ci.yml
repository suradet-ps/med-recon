name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Format, Clippy & Test (root workspace)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create dist placeholder (required by tauri::generate_context!)
        run: mkdir -p apps/med-recon-app/frontend/dist && touch apps/med-recon-app/frontend/dist/index.html

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - name: Cargo format check
        run: cargo fmt --all -- --check

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (backend packages)
        # `apps/med-recon-app/frontend` (med-recon-frontend) is a Leptos CSR crate that
        # only builds for wasm32, so it is excluded here and exercised by the
        # wasm-frontend / wasm-tests jobs below.
        run: cargo test -p med-recon-core -p med-recon-hosxp -p med-recon-config -p med-recon-bridge -p med-recon-app

  wasm-frontend:
    name: WASM Frontend (apps/med-recon-app/frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - name: Cargo format check (root workspace)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (wasm32, deny warnings)
        run: cargo clippy -p med-recon-frontend --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Install Trunk
        run: |
          # GitHub release downloads occasionally drop the connection;
          # retry before giving up.
          for attempt in 1 2 3 4; do
            curl -LsSf https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o trunk.tar.gz \
              && tar -xzf trunk.tar.gz \
              && sudo mv trunk /usr/local/bin/ \
              && break
            echo "trunk download failed (attempt $attempt/4) — retrying in 10s"
            sleep 10
          done
          test -x /usr/local/bin/trunk

      - name: Build frontend (trunk)
        working-directory: apps/med-recon-app
        run: |
          # trunk downloads the matching wasm-bindgen CLI from GitHub
          # releases, which occasionally flakes mid-connection — retry the
          # whole build (cached artifacts make retries cheap).
          for attempt in 1 2 3 4; do
            trunk build frontend/index.html --release && exit 0
            echo "trunk build failed (attempt $attempt/4) — retrying in 10s"
            sleep 10
          done
          exit 1

  wasm-tests:
    name: WASM Tests (headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        # The test runner comes from crates.io (more reliable than the
        # GitHub release downloads trunk/wasm-pack use — those flake, see
        # the retry loops above). Version must match Cargo.lock exactly.
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install chromedriver matching the runner's Chrome
        run: |
          CHROME_VERSION=$(google-chrome --version | sed -E 's/.*Chrome ([0-9.]+).*/\1/')
          curl -LsSf "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -o /tmp/chromedriver.zip
          unzip -o -q /tmp/chromedriver.zip -d /tmp
          sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/
          chromedriver --version

      - name: Run wasm tests
        env:
          # wasm-bindgen-test-runner (0.2.127) has no --chrome flag: it
          # locates the driver via the CHROMEDRIVER env var (or PATH) and
          # runs headless by default (NO_HEADLESS would disable it). The
          # run_in_browser test config selects the browser mode.
          CHROMEDRIVER: /usr/local/bin/chromedriver
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: "wasm-bindgen-test-runner"
        run: cargo test -p med-recon-frontend --target wasm32-unknown-unknown

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all
          manifest-path: Cargo.toml
