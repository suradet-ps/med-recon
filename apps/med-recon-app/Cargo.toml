[package]
name = "med-recon-app"
description = "Med Recon desktop shell: Tauri 2 backend serving the Leptos frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
med-recon-core = { workspace = true }
med-recon-hosxp = { workspace = true }
med-recon-config = { workspace = true }
sqlx = { workspace = true }             # error classification in map_repo_error
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = { workspace = true }
pdf-writer = { workspace = true }   # A4 PDF report generation
rustybuzz = { workspace = true }    # Thai text shaping for the PDF (marks/vowels)
ttf-parser = { workspace = true }   # font metrics + glyph coverage for PDF layout
base64 = { workspace = true }        # patient photo BLOB → data URL over IPC
secrecy = { workspace = true }          # password wrapper in SiteConfigInput conversion
encryptman = "0.3.0"                    # ephemeral vault fallback (headless)

[target.'cfg(windows)'.dependencies]
# WebView2 COM bindings for the screenshot feature (DevTools Protocol
# Page.captureScreenshot - re-rasterizes at devicePixelRatio, unlike
# CapturePreview which grabs the DPI-scaled on-screen surface). Already in
# the tree via wry; added as a direct dep only.
webview2-com = "0.38"
