[workspace]
resolver = "2"
members = [
    "crates/med-recon-core",
    "crates/med-recon-hosxp",
    "crates/med-recon-config",
    "crates/med-recon-bridge",
    "apps/med-recon-app",
    "apps/med-recon-app/frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suradet-ps/med-recon"
authors = ["suradet-ps"]

[workspace.dependencies]
med-recon-core = { path = "crates/med-recon-core" }
med-recon-hosxp = { path = "crates/med-recon-hosxp" }
med-recon-config = { path = "crates/med-recon-config" }
med-recon-bridge = { path = "crates/med-recon-bridge" }

serde = { version = "1.0", features = ["derive"] }          # serialization across the boundary
serde_json = "1.0"                                          # JSON payloads for Tauri IPC
thiserror = "2"                                             # structured errors in lib code
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }  # date math + BE/CE conversion
secrecy = { version = "0.10", features = ["serde"] }        # password protection in memory
tracing = "0.1"                                             # structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # log output
directories = "6.0"                                         # platform config dirs
encryptman = "0.3.0"                                        # AES-256-GCM settings encryption
encryptman-keyring = "0.1.3"                                # OS keychain master key
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "derive"] }  # async MySQL/MariaDB client (HOSxP), read-only
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }  # async runtime
tauri = { version = "2", features = [] }                    # desktop shell
tauri-build = "2"                                           # tauri context generation
rfd = "0.17"                                                # native save dialog for report export
leptos = "0.8"                                              # reactive UI framework (frontend)
leptos_router = "0.8"                                       # client-side routing
wasm-bindgen = "0.2"                                        # wasm interop
wasm-bindgen-futures = "0.4"                                # async on wasm
js-sys = "0.3"                                              # window/global access on wasm
web-sys = "0.3"                                             # DOM access on wasm
