<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%">
  <defs>
    <!-- Hard Pop Art Shadow -->
    <filter id="pop-shadow-med-recon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="10"
        dy="12"
        stdDeviation="0"
        flood-color="#14161A"
        flood-opacity="1"
      />
    </filter>
  </defs>

<!-- ============================================================
       MED RECON BRAND BACKGROUND
       Disc: warm yellow #FBC02D
       ============================================================ -->

  <circle
    cx="280"
    cy="280"
    r="230"
    fill="#FBC02D"
    stroke="#14161A"
    stroke-width="12"
    filter="url(#pop-shadow-med-recon)"
  />

  <!-- ============================================================
       SUBTLE CREAM ACCENT
       Adds visual depth without introducing a new color family
       ============================================================ -->

  <circle
    cx="280"
    cy="280"
    r="196"
    fill="none"
    stroke="#FFF8E1"
    stroke-width="5"
    opacity="0.45"
  />

  <!-- ============================================================
       ANGLED MEDICATION BLISTER
       ============================================================ -->

  <g
    transform="translate(280, 270) rotate(-12) translate(-280, -270)"
    filter="url(#pop-shadow-med-recon)"
  >

    <!-- Blister Board -->
    <rect
      x="150"
      y="130"
      width="260"
      height="280"
      rx="30"
      fill="#FFFFFF"
      stroke="#14161A"
      stroke-width="11"
    />

<!-- ==========================================================
         FOUR MEDICATION POCKETS
         Light green: #66BB6A
         ========================================================== -->

    <circle
      cx="210"
      cy="200"
      r="35"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="8"
    />

    <circle
      cx="350"
      cy="200"
      r="35"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="8"
    />

    <circle
      cx="210"
      cy="340"
      r="35"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="8"
    />

    <circle
      cx="350"
      cy="340"
      r="35"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="8"
    />

    <!-- ==========================================================
         BLISTER DIVIDERS
         ========================================================== -->

    <line
      x1="150"
      y1="270"
      x2="410"
      y2="270"
      stroke="#14161A"
      stroke-width="6"
      stroke-dasharray="12 12"
    />

    <line
      x1="280"
      y1="130"
      x2="280"
      y2="410"
      stroke="#14161A"
      stroke-width="6"
      stroke-dasharray="12 12"
    />

  </g>

  <!-- ============================================================
       MEDICATION RECONCILIATION BADGE
       ============================================================ -->

  <g
    transform="translate(350, 330) rotate(10)"
    filter="url(#pop-shadow-med-recon)"
  >

<!-- Badge -->
    <circle
      cx="0"
      cy="0"
      r="65"
      fill="#FFFFFF"
      stroke="#43A047"
      stroke-width="10"
    />

    <!-- ==========================================================
         MEDICAL CROSS
         Medium green: #2E7D32
         ========================================================== -->

    <path
      d="
        M -15 -5
        H -5
        V -15
        H 5
        V -5
        H 15
        V 5
        H 5
        V 15
        H -5
        V 5
        H -15
        Z
      "
      fill="#2E7D32"
      stroke="#14161A"
      stroke-width="3"
    />

    <!-- ==========================================================
         RECONCILIATION / SYNC ARROW — TOP
         ========================================================== -->

    <path
      d="M -28 -14 A 32 32 0 0 1 25 -20"
      fill="none"
      stroke="#66BB6A"
      stroke-width="6"
      stroke-linecap="round"
    />

    <polygon
      points="25,-26 31,-19 23,-16"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="1"
    />

    <!-- ==========================================================
         RECONCILIATION / SYNC ARROW — BOTTOM
         ========================================================== -->

    <path
      d="M 28 14 A 32 32 0 0 1 -25 20"
      fill="none"
      stroke="#66BB6A"
      stroke-width="6"
      stroke-linecap="round"
    />

    <polygon
      points="-25,26 -31,19 -23,16"
      fill="#66BB6A"
      stroke="#14161A"
      stroke-width="1"
    />

  </g>
</svg>

