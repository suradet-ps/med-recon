<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ============================================================
         SOFT INNER GLOW
         Lifts the four pockets off the panel. There is deliberately
         no outer drop shadow: the icon must keep a clean silhouette
         at every platform size (dock, taskbar, store tiles).
         ============================================================ -->
    <filter id="inner-glow-med-recon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <!-- ============================================================
         BLISTER PANEL GRADIENT
         Soft yellow, lit from the upper left:
         #FEF9C3 (light) -> #FEF08A (mid) -> #FDE047 (deep)
         ============================================================ -->
    <radialGradient id="panel-yellow-med-recon" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </radialGradient>

    <!-- ============================================================
         FILLED POCKET GRADIENT
         White fading to cream: #FFFFFF -> #FEF3C7
         ============================================================ -->
    <radialGradient id="pocket-white-med-recon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.9" />
    </radialGradient>

    <!-- ============================================================
         EMPTIED POCKET GRADIENT
         Soft green tint: #F0FDF4 -> #D1FAE5
         ============================================================ -->
    <radialGradient id="pocket-empty-med-recon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="1" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- ============================================================
       BLISTER PANEL
       Rounded yellow square, #EAB308 border. No shadow filter here -
       the former hard outer shadow was dropped on purpose.
       ============================================================ -->

  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="88"
    fill="url(#panel-yellow-med-recon)"
    stroke="#EAB308"
    stroke-width="8"
  />

  <!-- ============================================================
       FOUR POCKETS
       Centered and slightly enlarged (1.35x) so the strip reads as
       one solid panel instead of four floating bubbles.
       ============================================================ -->

  <g transform="translate(256, 256) scale(1.35)" filter="url(#inner-glow-med-recon)">

    <!-- Pocket 1 (green pill - top left) -->
    <g transform="translate(-68, -68)">
      <circle cx="0" cy="0" r="62" fill="url(#pocket-white-med-recon)" stroke="#FDE68A" stroke-width="3.5" />
      <circle cx="0" cy="0" r="38" fill="#059669" />
      <ellipse cx="-8" cy="-10" rx="10" ry="5" fill="#FFFFFF" opacity="0.5" />
    </g>

    <!-- Pocket 2 (already taken - top right, "?" placeholder) -->
    <g transform="translate(68, -68)">
      <circle cx="0" cy="0" r="62" fill="url(#pocket-empty-med-recon)" stroke="#A7F3D0" stroke-width="3.5" />
      <circle cx="0" cy="0" r="28" fill="#10B981" />
      <text x="0" y="10" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#FFFFFF" text-anchor="middle">?</text>
    </g>

    <!-- Pocket 3 (green pill - bottom left) -->
    <g transform="translate(-68, 68)">
      <circle cx="0" cy="0" r="62" fill="url(#pocket-white-med-recon)" stroke="#FDE68A" stroke-width="3.5" />
      <circle cx="0" cy="0" r="38" fill="#059669" />
      <ellipse cx="-8" cy="-10" rx="10" ry="5" fill="#FFFFFF" opacity="0.5" />
    </g>

    <!-- Pocket 4 (green pill - bottom right) -->
    <g transform="translate(68, 68)">
      <circle cx="0" cy="0" r="62" fill="url(#pocket-white-med-recon)" stroke="#FDE68A" stroke-width="3.5" />
      <circle cx="0" cy="0" r="38" fill="#059669" />
      <ellipse cx="-8" cy="-10" rx="10" ry="5" fill="#FFFFFF" opacity="0.5" />
    </g>

  </g>
</svg>
